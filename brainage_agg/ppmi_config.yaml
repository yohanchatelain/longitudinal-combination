data:
  cohort_csv: "PPMI_data/cohort_longitudinal.csv"
  feature_dir: "PPMI_data/features"
  fs_roi_file: "features__model-freesurfer_roi__scaler-none__channels-all_roi__seed-0.npz"
  fs_root: "ppmi"  # FreeSurfer outputs: ppmi/<directory>/mri/brain.mgz, aparc+aseg.mgz
  band_map:
    PPMI_PD: PD
    PPMI_HC: HC
  delta_t_max: 1.5  # keep mode-1 subjects only (natural valley at ~1.5yr between modes 1 and 2)

output:
  result_dir: "brainage_agg/ppmi_outputs"

seeds:
  t_mid: 42
  cv_outer: 0

cv:
  n_outer_folds: 5
  n_inner_folds: 3
  ridge_alphas: [0.01, 0.1, 1.0, 10.0, 100.0, 1000.0]

lme:
  use_statsmodels_threshold: 0

targets:
  brain_change_rate_pca_seed: 42
  # ICV-corrected counterpart: not available for PPMI (Destrieux atlas, no scaler-icv variant)
  # Omitting brain_change_rate_icv_file → PCA runs on raw ROI features
